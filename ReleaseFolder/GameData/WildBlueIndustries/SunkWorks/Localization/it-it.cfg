		#LOC_SUNKWORKS_scubaGearTitle = Attrezzatura SKUBA
		#LOC_SUNKWORKS_scubaGearDesc = Questo autorespiratore subacqueo non solo permette ai kerbal di respirare sott'acqua, ma ne controlla anche il galleggiamento. Ricordati di indossare il casco! Senza di esso l'attrezzatura SCUBA non eroga aria, costringendoti a trattenere il respiro. Appena sotto la superficie l'aria dura un'ora, ma il consumo raddoppia ogni 10 metri di profondità, a meno che non indossi una tuta da immersione atmosferica.
