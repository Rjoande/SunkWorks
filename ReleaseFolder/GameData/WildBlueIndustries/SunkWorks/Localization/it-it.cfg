		#LOC_SUNKWORKS_companyDesc = Tecnologie Marittime SunkWorks, nota anche come SunkWorks, è specializzata in tutto ciò che riguarda l'acqua. SunkWorks fornisce componenti modulari per costruire vari tipi di imbarcazioni, tra cui navi da ricerca, navi cargo, navi per il recupero di veicoli spaziali e sottomarini. L'azienda è nata da un refuso di una lettera e dalla necessità di dare sostanza a un'industria cantieristica poco sviluppata. Il motto della divisione sottomarini è: "Se galleggia, possiamo affondarlo."
			
