		// Liquid Breathing Pack
		#LOC_SUNKWORKS_lbaTitle = Kit respirazione liquida
		#LOC_SUNKWORKS_lbaDesc = A differenza dell'attrezzatura SCUBA, che eroga aria compressa per respirare sott'acqua con un limite di circa 300 m, il Kit Respirazione Liquida sostituisce l'aria con perfluorocarburi (PFC), liquidi che contengono più ossigeno del sangue. Il liquido consente ai subacquei di raggiungere profondità ben maggiori rispetto a quelle ottenibili con l'attrezzatura SCUBA.

